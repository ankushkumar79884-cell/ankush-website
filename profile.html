<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Settings | ANKUSH</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#030303;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:750px;
    padding:35px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(0,255,255,.2);
    border-radius:25px;

    box-shadow:0 0 40px rgba(0,255,255,.08);
}

h1{
    text-align:center;
    color:cyan;
    text-shadow:0 0 15px cyan;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.avatar{
    width:120px;
    height:120px;
    margin:0 auto 15px;

    display:flex;
    justify-content:center;
    align-items:center;

    border:2px solid cyan;
    border-radius:50%;

    overflow:hidden;
    background:#080808;

    box-shadow:0 0 25px rgba(0,255,255,.3);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.avatar span{
    font-size:45px;
}

.photo-label{
    display:block;
    width:max-content;
    margin:0 auto 30px;

    padding:10px 20px;

    background:#111;
    color:cyan;

    border:1px solid cyan;
    border-radius:25px;

    cursor:pointer;
}

#photoInput{
    display:none;
}

label{
    display:block;
    color:cyan;
    margin:18px 0 8px;
}

input[type="text"],
input[type="email"],
textarea{
    width:100%;
    padding:14px;

    background:#080808;
    color:white;

    border:1px solid #333;
    border-radius:10px;

    outline:none;
    font-size:15px;
}

input:focus,
textarea:focus{
    border-color:cyan;
    box-shadow:0 0 10px rgba(0,255,255,.2);
}

textarea{
    min-height:110px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:30px;
}

button,
.back{
    flex:1;
    padding:14px;

    border-radius:25px;

    font-weight:bold;
    text-align:center;

    cursor:pointer;
    text-decoration:none;
}

button{
    border:none;
}

.save{
    background:cyan;
    color:#030303;
}

.back{
    background:#111;
    color:cyan;
    border:1px solid cyan;
}

button:hover,
.back:hover,
.photo-label:hover{
    box-shadow:0 0 20px cyan;
}

#message{
    display:none;
    text-align:center;
    color:#00ff99;
    margin-top:20px;
}

@media(max-width:600px){

    .container{
        padding:25px 20px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>PROFILE SETTINGS</h1>

<p class="subtitle">
Customize your personal profile
</p>


<!-- PROFILE PHOTO -->

<div class="avatar">

    <span id="defaultAvatar">👤</span>

    <img id="profileImage" src="" alt="Profile Photo">

</div>

<label for="photoInput" class="photo-label">
    📷 Choose Profile Photo
</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>


<!-- NAME -->

<label for="name">
    Your Name
</label>

<input
    type="text"
    id="name"
    placeholder="Enter your name"
>


<!-- BIO -->

<label for="bio">
    About You
</label>

<textarea
    id="bio"
    placeholder="Write something about yourself..."
></textarea>


<!-- SKILLS -->

<label for="skills">
    Skills
</label>

<input
    type="text"
    id="skills"
    placeholder="HTML, CSS, JavaScript..."
>


<!-- EMAIL -->

<label for="email">
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
>


<!-- BUTTONS -->

<div class="buttons">

    <button
        class="save"
        onclick="saveProfile()"
    >
        SAVE PROFILE
    </button>

    <a
        href="../index.html"
        class="back"
    >
        ← BACK
    </a>

</div>


<div id="message">
    ✓ Profile saved successfully!
</div>

</div>


<script>

/* =========================
   PROFILE PHOTO
========================= */

document
.getElementById("photoInput")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const image =
            document.getElementById("profileImage");

        image.src = e.target.result;

        image.style.display = "block";

        document.getElementById("defaultAvatar")
            .style.display = "none";

        localStorage.setItem(
            "profilePhoto",
            e.target.result
        );
    };

    reader.readAsDataURL(file);

});


/* =========================
   SAVE PROFILE
========================= */

function saveProfile(){

    const name =
        document.getElementById("name").value;

    const bio =
        document.getElementById("bio").value;

    const skills =
        document.getElementById("skills").value;

    const email =
        document.getElementById("email").value;


    localStorage.setItem(
        "profileName",
        name
    );

    localStorage.setItem(
        "profileBio",
        bio
    );

    localStorage.setItem(
        "profileSkills",
        skills
    );

    localStorage.setItem(
        "profileEmail",
        email
    );


    document.getElementById("message")
        .style.display = "block";

}


/* =========================
   LOAD SAVED PROFILE
========================= */

window.onload = function(){

    document.getElementById("name").value =
        localStorage.getItem("profileName") || "";

    document.getElementById("bio").value =
        localStorage.getItem("profileBio") || "";

    document.getElementById("skills").value =
        localStorage.getItem("profileSkills") || "";

    document.getElementById("email").value =
        localStorage.getItem("profileEmail") || "";


    /* LOAD PHOTO */

    const savedPhoto =
        localStorage.getItem("profilePhoto");

    if(savedPhoto){

        document.getElementById("profileImage").src =
            savedPhoto;

        document.getElementById("profileImage")
            .style.display = "block";

        document.getElementById("defaultAvatar")
            .style.display = "none";
    }

};

</script>

</body>
</html>
