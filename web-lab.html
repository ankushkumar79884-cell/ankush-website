<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEB LAB | ANKUSH</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:#030303;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    width:90%;
    max-width:800px;
    padding:50px 25px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(0,255,255,.2);
    border-radius:25px;

    box-shadow:0 0 40px rgba(0,255,255,.08);
}

.icon{
    font-size:80px;
}

h1{
    font-size:55px;
    color:cyan;
    text-shadow:0 0 20px cyan;
    margin:15px 0;
}

p{
    color:#aaa;
    font-size:18px;
    line-height:1.8;
}

.status{
    color:#00ff99;
    margin:20px 0;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;

    color:#030303;
    background:cyan;

    text-decoration:none;
    border-radius:25px;
    font-weight:bold;

    transition:.3s;
}

.back:hover{
    box-shadow:0 0 25px cyan;
    transform:translateY(-3px);
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">🌐</div>

    <h1>WEB LAB</h1>

    <div class="status">
        ● PROJECT ACTIVE
    </div>

    <p>
        A collection of modern websites created
        using HTML, CSS and JavaScript while
        learning web development.
    </p>

    <a href="../index.html" class="back">
        ← BACK TO WEBSITE
    </a>

</div>

</body>
</html>
